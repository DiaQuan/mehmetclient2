name: Build Mehmet Client JAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: List generated JAR files
        shell: bash
        run: |
          echo "Contents of build/libs:"
          ls -lah build/libs
          echo "JAR files found:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: MehmetClient-${{ github.sha }}
          # Do not hardcode the mod version here. Gradle names the JAR from
          # gradle.properties, so this wildcard keeps uploads working on version bumps.
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
